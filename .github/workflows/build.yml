name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify keystore present
        run: |
          if [ ! -f app/darmanagarno-release.jks ]; then
            echo "ERROR: app/darmanagarno-release.jks not found"
            exit 1
          fi
          ls -la app/darmanagarno-release.jks

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List APK outputs
        run: find app/build/outputs -name "*.apk" -type f -ls || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: darmanagarno-release-v5.14.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
